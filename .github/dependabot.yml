version: 2
updates:
  # Una sola PR semanal con las actualizaciones menores; las mayores llegan por separado
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
