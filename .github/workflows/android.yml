name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Tipos, lint (oxlint), formato (Prettier) y tests (incluye SQLite real con sql.js)
      - name: Checks
        run: |
          npm ci
          npm run check

      - name: Build web app
        env:
          # Key de Google Books restringida a la app firmada (paquete + SHA-1); si falta, cuota compartida
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
        run: |
          npm run build
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      # Sin los secretos cada compilación usa una clave de debug nueva y el APK no se instala
      # como actualización. Se arregla una vez con scripts/setup-signing.sh.
      - name: Warn about missing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Sin secretos de firma; este APK usa una clave de debug y no actualiza la app instalada. Corre scripts/setup-signing.sh."

      # La etiqueta tiene que coincidir con la versión de package.json (scripts/release.sh hace ambas)
      - name: Check version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de package.json"
            exit 1
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Lo que se compila desde main sin ser release queda marcado para no confundirlo
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            export VERSION_SUFFIX="-dev.$GITHUB_RUN_NUMBER"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/bookloft-${{ steps.version.outputs.version }}.apk"

      # Un push a main solo comprueba que compila (el APK queda como artefacto del workflow)
      - uses: actions/upload-artifact@v4
        with:
          name: bookloft-apk
          path: bookloft-*.apk
          retention-days: 14

      # Las etiquetas de versión (v1.2.3) publican una release con su parte del CHANGELOG
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          section() {
            awk -v v="$VERSION" '
              /^## / { p = index($0, "[" v "]") > 0; next }
              p
            ' "$1"
          }
          # Español primero y después inglés, como en la app
          { section CHANGELOG.md; printf '\n---\n\n**English**\n'; section CHANGELOG.en.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" "bookloft-$VERSION.apk" \
            --title "Bookloft $VERSION" --notes-file notes.md --latest
